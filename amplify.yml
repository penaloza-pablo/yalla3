version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - |
          echo "Building branch: ${AWS_BRANCH}"
          case "${AWS_BRANCH}" in
            main)
              echo "Deploying backend for main"
              npx ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID"
              ;;
            *)
              echo "Reusing main backend outputs (no backend deploy)"
              npx ampx generate outputs --branch main --app-id "$AWS_APP_ID"
              ;;
          esac
frontend:
  phases:
    build:
      commands:
        - npm run build
        - cp amplify_outputs.json dist/amplify_outputs.json
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
