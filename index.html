<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var path = location.pathname.replace(/\/+$/, '')
        if (path !== '/read-api') return
        var request = new XMLHttpRequest()
        request.open('GET', '/read-api/index.html', false)
        request.send(null)
        if (
          request.status === 200 &&
          request.responseText.indexOf('Catálogo de datos Yalla') !== -1
        ) {
          document.open()
          document.write(request.responseText)
          document.close()
        }
      })()
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/Yalla_logo/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/Yalla_logo/icon-192.png" />
    <link rel="apple-touch-icon" href="/Yalla_logo/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#3D5B58" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Yalla!" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Yalla!</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
